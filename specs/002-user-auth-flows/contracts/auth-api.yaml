openapi: 3.0.3
info:
  title: Recruitment Platform Authentication API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /auth/register:
    post:
      summary: Register a Candidate or Recruiter and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and authenticated session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Field validation failure
        '409':
          description: Email already registered
  /auth/login:
    post:
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Generic invalid credentials or request validation failure
        '403':
          description: Account inactive or temporarily locked
  /auth/session:
    get:
      summary: Validate and renew the current session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Missing, expired, or revoked session
  /auth/logout:
    post:
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked; the client must clear local auth state
        '401':
          description: Session missing or already invalid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Must include uppercase, number, and special character
        fullName:
          type: string
        role:
          type: string
          enum: [CANDIDATE, RECRUITER]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [token, userId, email, fullName, role, expiresAt]
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [CANDIDATE, RECRUITER, MODERATOR, ADMIN]
        expiresAt:
          type: string
          format: date-time
